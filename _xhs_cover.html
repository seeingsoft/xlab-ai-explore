<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
  *{margin:0; padding:0; box-sizing:border-box;}
  body{width:1080px; height:1440px; font-family:"Yuanti SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:#f7f6ff; color:#2a2550; overflow:hidden;}
  .pg{width:1080px; height:1440px; padding:64px 70px; display:flex; flex-direction:column;}
  /* ── 封面 ── */
  .brand{display:flex; align-items:center; gap:20px;}
  .brand img{width:92px; height:92px; border-radius:24px; object-fit:contain; background:#fff;}
  .brand .t{font-size:40px; font-weight:900; color:#4433a8; letter-spacing:1px;}
  .brand .s{font-size:23px; color:#6a6788; margin-top:4px;}
  .issue{margin-left:auto; background:#fff; border:2px solid #e6e2f7; border-radius:99px;
         padding:12px 30px; font-size:27px; color:#5b4bc4; font-weight:800;}
  .big{font-size:92px; font-weight:900; line-height:1.24; margin-top:56px; letter-spacing:3px;}
  .big em{color:#5b4bc4; font-style:normal;}
  .hero{flex:1; margin-top:46px; border-radius:38px; overflow:hidden; box-shadow:0 26px 64px rgba(91,75,196,.20);}
  .hero img{width:100%; height:100%; object-fit:cover;}
  .tags{display:flex; gap:18px; margin-top:46px; justify-content:center;}
  .tag{background:#fff; border:2px solid #e6e2f7; border-radius:99px; padding:16px 34px;
       font-size:28px; font-weight:700; color:#4433a8;}
  /* ── 内容卡 ── */
  .cpg{width:1080px; height:1440px; display:flex; flex-direction:column; overflow:hidden; background:#f7f6ff;}
  .art{width:1080px; height:575px; overflow:hidden; flex:none;}
  .art img{width:100%; height:100%; object-fit:cover;}
  .inner{padding:36px 70px 16px; display:flex; flex-direction:column; flex:1;}
  .head{display:flex; align-items:center; gap:18px;}
  .idx{width:76px; height:76px; border-radius:50%; background:#5b4bc4; color:#fff;
       font-size:35px; font-weight:900; display:flex; align-items:center; justify-content:center;
       box-shadow:0 8px 22px rgba(91,75,196,.35);}
  .cat{background:#eeeafd; color:#4433a8; font-size:25px; font-weight:800; padding:8px 24px; border-radius:99px;}
  .date{margin-left:auto; color:#8b88a8; font-size:24px; font-weight:600;}
  h2{font-size:48px; font-weight:900; line-height:1.3; margin-top:20px; letter-spacing:1px;}
  .what{margin-top:16px; font-size:30px; line-height:1.6; color:#3a3560;}
  .duo{display:flex; gap:14px; margin-top:16px; align-items:stretch;}
  .duo>div{flex:1; border-radius:18px; padding:14px 20px; font-size:25px; line-height:1.5;}
  .why{background:#fff7ea; color:#6b4a1f;}
  .why b{color:#b26a00;}
  .task{background:#eef7f1; color:#28563c;}
  .task b{color:#2f7d52;}
  .glos{margin-top:12px; background:#fff; border:2px solid #e6e2f7; border-radius:22px; padding:14px 26px 15px;}
  .glos .gt{font-size:26px; font-weight:900; color:#4433a8; margin-bottom:4px;}
  .glos .gi{font-size:25px; line-height:1.48; color:#3a3560; margin-top:5px;}
  .glos .gi b{color:#5b4bc4;}
  .foot{margin-top:auto; display:flex; align-items:center; gap:12px; color:#8b88a8;
        font-size:24px; font-weight:600; padding-top:8px;}
  .foot b{color:#5b4bc4;}
</style></head>
<body><div class="pg">
  <div class="brand">
    <img src="assets/xlab-logo.jpg">
    <div><div class="t">xLab-AI 探索报</div><div class="s">给小朋友的 AI 科技日报</div></div>
    <div class="issue">第 4 期</div>
  </div>
  <div class="big">10月14日的AI大事<br>挑 <em>5</em> 件讲给小朋友听</div>
  <div class="hero"><img src="assets/_xhsstyle_20261014_01.jpg"></div>
  <div class="tags"><span class="tag">适合 8-16 岁</span><span class="tag">每天三分钟</span><span class="tag">能听懂 能动手</span></div>
</div></body></html>
