一家做开放模型的小公司Reflection AI谈收购或追加投资，谈判还在早期，可能几周内有结果。这家公司今年估值已经很高了。", "body": "英伟达是一家做AI芯片的大公司，现在它正在和一家叫Reflection AI的初创公司谈判，想收购这家公司，或者再给它投一笔钱。谈判还在初期阶段，双方可能在未来几周内敲定方案。\n\nReflection AI今年3月上一轮融资时估值达到250亿美元，英伟达此前已经向它投了8亿美元。这家公司在10月5日发布了首款开放权重模型Beam。报道说，选项之一是\"人才兼并\"结构，就是雇佣团队并授权技术，这样可以避开全面收购的反垄断审查。英伟达去年12月对Groq的200亿美元交易就用了这种结构。\n\n什么是\"人才兼并\"呢？就是大公司不直接把整个小公司买下来，而是把小公司的团队请过来，再花钱获得它的技术使用权。这样做的好处是不用经过复杂的反垄断审查。反垄断审查就是政府检查一笔收购会不会让某家公司太强大、影响公平竞争。\n\n目前交易金额和具体条款还没公布，也没说是否已经达成协议。后续会不会真的成交，还要再等等看。", "kid_why": "你用的AI工具背后，可能就有这些公司在互相投资合作。", "title": "英伟达洽谈收购或追加投资Reflection AI", "sources": 4, "participants": 17, "aihot": "https://aihot.news/items/pygydfau6gpr3a7v7ko4y49ww", "story": "https://aihot.virxact.com/story/244f781e-a578-4493-804d-4b4cfa063ea3", "media": ["X：马东锡 NLP (@dongxi_nlp)", "IT之家·人工智能", "X：Rohan Paul (@rohanpaul_ai)", "Hacker News：AI 热帖"], "audio": "assets/audio/hot-2026-10-11-1.mp3"}, {"rank": 2, "one_line": "微软CEO说：AI模型要像飞机汽车一样被管起来", "summary": "微软CEO纳德拉提出，超级智能时代要把AI模型当成\"内部风险\"来管理，给模型装上\"紧急刹车\"，还主张默认假设模型已被攻破。", "body": "微软CEO萨提亚·纳德拉在社交平台上发文，提出在超级智能时代，应该把前沿的闭源和开源模型当作\"内部风险\"来治理。他的核心想法是把智能的供给和对它的授权分开管理。\n\n他主张把模型和编排它工作的系统分开，把控制和安全防护放在外面，为每个关键模型动作留下防篡改的人类可读证据，并让授权者能随时在任务中途暂停或关闭模型，他比喻为紧急刹车。The Verge报道称他还主张默认假设模型已被攻破，从一开始就加以隔离，推进事件及时披露、独立审计、可验证数据等标准化措施。IT之家称他要求模型提供商不能把责任外包出去。\n\nThe Decoder报道认为，他的论点主要服务于微软的商业策略，即削弱对OpenAI和Anthropic模型的依赖。马斯克在X上评论该文\"很有意思\"。微软AI CEO Mustafa Suleyman同日发帖称超智能必须被约束，并类比飞机、汽车、核材料、食品安全、药品等领域的既有管控。\n\n这些讨论说明，AI越来越强大后，怎么管好它成了大家都在想的问题。后续会不会有更多公司跟进类似主张，值得关注。", "kid_why": "以后你用的AI可能会被要求装上\"刹车\"，随时能被暂停。", "title": "纳德拉：把前沿模型当内部风险管控", "sources": 6, "participants": 16, "aihot": "https://aihot.news/items/ubbzc82ewyencdpy65uu3zwlo", "story": "https://aihot.virxact.com/story/ba1d5ac2-160e-4d9d-ae98-63405a9bb3f3", "media": ["The Decoder：AI News（RSS）", "IT之家·人工智能", "The Verge：AI（RSS）", "TechCrunch：AI（RSS）", "X：Mustafa Suleyman（Microsoft AI CEO） (@mustafasuleyman)"], "audio": "assets/audio/hot-2026-10-11-2.mp3"}, {"rank": 4, "one_line": "Grok Bot现在有自己的邮箱了，能帮你订阅和联系商家", "summary": "Grok Bot新增专属邮箱功能，可以用来注册服务、代用户联系商家、订阅newsletter或安排时间。用户可以通过询问Bot或在X上标记@bot领取收件箱。", "body": "Grok Bot现在拥有自己的专属邮箱了。这个邮箱可以用来注册各种服务、代用户联系商家、订阅newsletter，或者和别人安排时间。该功能于2026年10月10日开始向用户推送，用户可以通过询问Bot或在X上标记@bot来领取收件箱。团队使用需要由管理员开启。\n\n据Grok官方展示，邮箱地址形如your-bot@mail.grokbot.com。用户可以让机器人自行设置地址，或在回复中@bot使用该邮箱。Elon Musk称Grok @Bot现在可以自行设置邮箱。Testing Catalog称实测让Grok Bot订阅其Daily AI Brief newsletter，机器人完成了订阅。IT之家报道称，该功能正逐步开放，具体可用范围及权限设置以官方实际推送为准。\n\n什么是newsletter呢？就是定期发送的电子邮件简报，比如某个网站每周给你发一封邮件，告诉你这周有什么新内容。以前你需要自己填邮箱去订阅，现在可以让Grok Bot帮你做这件事。\n\n这个功能还在逐步开放中，后续会不会有更多机器人专属的邮箱功能，可以继续关注。", "kid_why": "以后你的AI助手可能帮你收邮件、订阅你喜欢的频道。", "title": "Grok Bot 新增专属邮箱功能", "sources": 6, "participants": 29, "aihot": "https://aihot.news/items/m77leauczmowax4odp8ql7dkl", "story": "https://aihot.virxact.com/story/d2b86a14-9162-49d5-9df2-0548df6c16a2", "media": ["IT之家·人工智能", "X：Testing Catalog (@testingcatalog)", "X：Eric Zakariasson (@ericzakariasson)", "X：Lauren Tan (@poteto)", "X：Elon Musk (@elonmusk, xAI)"], "audio": "assets/audio/hot-2026-10-11-4.mp3"}, {"rank": 6, "one_line": "谷歌发布新模型Gemini 4 Argon，先给政府和防御者用", "summary": "Google DeepMind发布新前沿模型Gemini 4 Argon，先通过Fairwind Program向美国政府及受信任的网络防御者开放，尚未面向公众。单次输出上限从64K提升到1M tokens。", "body": "Google DeepMind发布了一款新前沿模型，叫Gemini 4 Argon。它先通过Fairwind Program向美国政府及一批受信任的网络防御者开放，还没有面向公众。Google称后续将逐步向开发者、企业和消费者推出，先覆盖付费API客户和Google AI Ultra订阅用户。该模型单次输出上限从64K提升到1M tokens，主打软件工程、法律金融等企业知识工作和网络安全防御。\n\n定价方面，Argon以每百万输入tokens 2美元、输出10美元的introductory价格推出，缓存输入按输入价95%折扣。Google未确认该促销的结束日期，标准价为输入4美元、输出20美元。Artificial Analysis评测其高推理档在Intelligence Index得53分，追平GPT-6 Astra，领先GPT-6.1 Sol 1分。Arena显示其High版本登顶文本榜。\n\n内部对实际表现存在分歧：彭博社报道称知情人士认为Argon部分代码任务表现不佳、不擅前端设计，Google否认该说法，DeepMind负责人卡武库奥卢表示对性能感到鼓舞。此外，Business Insider报道Google内部已在测试Argon、Barium、Carbon等Gemini 4变体。\n\n这款模型后续会不会向公众开放、表现到底如何，还要等更多独立评测出来才知道。", "kid_why": "谷歌的新AI先给政府和防御者用，以后可能才会到你手里。", "title": "谷歌发布 Gemini 4 Argon，先供可信防御者", "sources": 2, "participants": 18, "aihot": "https://aihot.news/items/uob3jvsb97uh5achwaggjrhqh", "story": "https://aihot.virxact.com/story/daf111a0-908f-4f9c-8639-fc469d9ec53b", "media": ["The Decoder：AI News（RSS）", "IT之家·人工智能"], "audio": "assets/audio/hot-2026-10-11-6.mp3"}, {"rank": 7, "one_line": "微软发布决策模型，专门用来做选择题而不是聊天", "summary": "微软发布决策模型Microsoft-Decision-1，定位为快速单次决策打分，对固定选项输出校准概率而非生成文本，用于路由、分类、验证和智能体控制。已上线Microsoft Foundry并接入OpenRouter。", "body": "微软发布了一款决策模型，叫Microsoft-Decision-1。它的定位是快速单次决策打分，已经上线Microsoft Foundry并接入OpenRouter。这个模型基于Qwen3.5-9B后训练，对固定选项输出校准概率而不是生成文本，用于路由、分类、验证和智能体控制，不适用于文本生成、开放问答、聊天、翻译或摘要，且仅支持文本。\n\n微软CEO萨提亚·纳德拉称该模型在结构化决策任务上表现顶尖，延迟和质量均优于LLM及其他决策模型，并已在微软内部测试，覆盖事件响应、质量控制到科学发现。OpenRouter称其在36项盲测基准中准确率最高，比第二名快4.5倍、比GPT-6 Sol快35倍，扰动输入下仅1.3%的决策翻转。上述性能说法均来自微软和OpenRouter，尚未见独立验证。\n\n什么是\"决策模型\"呢？普通的AI像聊天机器人，会写文章、回答问题。而决策模型更像一个裁判，你给它几个选项，它告诉你选哪个最合适。比如在路口该走哪条路，它直接给出概率，而不是写一段话解释。\n\n该模型仅通过托管API提供，无开放权重和量化版本。后续会不会有更多这类专用模型出现，可以继续关注。", "kid_why": "以后AI不只会聊天，还能帮你做选择题，比如选哪条路最快。", "title": "微软发布决策模型 Microsoft-Decision-1", "sources": 6, "participants": 18, "aihot": "https://aihot.news/items/a7gbtbm6tcxqz7s7b369vdnvn", "story": "https://aihot.virxact.com/story/cd73b967-8f2e-455c-b267-b0f1904a91c4", "media": ["The Decoder：AI News（RSS）", "MarkTechPost（RSS）", "IT之家·人工智能", "X：OpenRouter (@OpenRouter)", "X：Testing Catalog (@testingcatalog)"], "audio": "assets/audio/hot-2026-10-11-7.mp3"}, {"rank": 8, "one_line": "一家20人小公司拿到8.7亿美元融资，估值75亿", "summary": "TypeSafe AI完成8.7亿美元A轮融资，估值75亿美元，由a16z领投。公司开发非文本AI模型Jev，将模型决策以类型化数值直接交给代码。团队刚满20人。", "body": "TypeSafe AI完成了一笔8.7亿美元的A轮融资，估值达到75亿美元，由Andreessen Horowitz领投，Sequoia Capital、既有投资方DCVC及多位天使投资人跟投，a16z的Martin Casado加入董事会。公司开发非文本AI模型Jev，将模型决策以类型化数值直接交给代码而不是文本。\n\n关于采用规模，a16z称Jev上线首周已有25%的财富500强企业接入，TypeSafe AI则称约三分之一财富500强企业在使用其产品。据彭博社报道，Jev上线数天内用户突破100万，平台每天处理数万亿token，扣除运营成本后已实现盈利。a16z称Jev上线3天生成1万亿tokens，成本约为前沿模型的1/100至1/500，分类任务速度提升100倍且精度相当。公司团队刚满20人，资金将用于扩充员工、推进大规模部署、采购更多算力并推出更多machine-native模型和企业级功能。\n\n什么是\"A轮融资\"呢？就是一家公司刚开始发展时，向投资人要的第一笔比较大的钱。投资人给钱，换公司的一部分股份。这家公司只有20人，却拿到了这么多钱，说明投资人很看好它。\n\n后续这笔钱会怎么花、Jev会不会被更多公司用起来，可以继续关注。", "kid_why": "20个人的小团队也能做出大公司都在用的AI工具。", "title": "a16z领投TypeSafe AI 8.7亿美元A轮", "sources": 5, "participants": 15, "aihot": "https://aihot.news/items/nop1nw81y2obkwa9apzdu3176", "story": "https://aihot.virxact.com/story/6667f027-8bc6-4ed3-b0e2-6e3b61e60803", "media": ["IT之家·人工智能", "TechCrunch：AI（RSS）", "Hacker News：AI 热帖", "X：TypeSafe AI (@typesafeai)", "a16z：News（RSS）"], "audio": "assets/audio/hot-2026-10-11-8.mp3"}, {"rank": 9, "one_line": "Grok Bot能拍照下单了，但有人担心信用卡安全", "summary": "xAI的Grok Bot新增拍照搜货下单功能。马斯克称用户拍一张信用卡照片丢进聊天，Grok Bot就会搜寻最优价格并下单。OpenAI团队负责人以AI生成的虚构信用卡照片回应，暗示安全风险。", "body": "xAI的Grok Bot新增了拍照搜货下单功能。Elon Musk在X上称，用户只需拍一张信用卡照片丢进聊天，Grok @Bot就会在网上为想要的商品搜寻最优价格并下单。他随后称自己让Grok @Bot研究最适合小孩子的乐高星球大战套装并下单，以此演示该功能。\n\nOpenAI Codex与ChatGPT团队负责人蒂博·索蒂奥以一张持卡人写着自己名字的AI生成虚构信用卡照片回应，暗示该功能的安全风险。有用户称亚马逊已屏蔽Grok Bot访问，Musk回复称Grok会另寻方式购物，并称其刚从乐高官网下单买了乐高。\n\n为什么大家担心呢？因为信用卡信息很重要，如果随便拍照发给AI，万一信息被泄露或误用，可能会有麻烦。就像你把家里的钥匙照片发给别人，虽然方便，但也要小心。\n\n上述说法均来自Musk的公开帖文，未提及功能上线时间、适用地区、可用商品范围，也未说明信用卡信息如何存储与使用。后续这个功能会不会调整安全措施，还要继续观察。", "kid_why": "这提醒我们，把重要信息拍照发给AI之前要多想一想。", "title": "Grok Bot 拍照下单功能引安全质疑", "sources": 2, "participants": 8, "aihot": "https://aihot.news/items/dcr5jgm4psy1hqi0bplj2t5h3", "story": "https://aihot.virxact.com/story/0239e0cb-2576-40cc-beb9-1b5db49a64f9", "media": ["X：Elon Musk (@elonmusk, xAI)", "IT之家·人工智能"], "audio": "assets/audio/hot-2026-10-11-9.mp3"}, {"rank": 10, "one_line": "高通CEO说AI公司要求2028年手机能跑100B模型", "summary": "高通CEO Cristiano Amon在访谈中称，部分前沿AI公司已向高通提出，到2028年需要让至少100B参数的模型在手机上持续运行。他同时确认这些AI公司正在开始自研手机。", "body": "高通CEO Cristiano Amon在Sources访谈中称，部分前沿AI公司已向高通提出，到2028年需要让至少100B参数的模型在手机上持续运行。他同时确认，这些AI公司正在开始自研手机。\n\n上述说法来自Amon本人，尚无AI公司方面公开确认，也未说明具体是哪些公司或采用何种技术路径。\n\n什么是\"100B参数\"呢？参数可以理解为AI模型里的\"小开关\"数量，参数越多，模型通常越聪明，但也越占空间和电力。现在手机上的AI模型一般只有几B到十几B参数，100B要大得多，相当于把一台大电脑塞进手机里。\n\n如果真能做到，以后你的手机可能不用联网就能运行很聪明的AI。更多细节还在陆续报道中。", "kid_why": "以后你的手机可能不用联网就能跑很聪明的AI。", "title": "高通 CEO 称 AI 公司要求 2028 年手机常驻运行 100B 模型", "sources": 1, "participants": 5, "aihot": "https://aihot.news/items/lahuztqitfbro4kg9otro2kpe", "story": "https://aihot.virxact.com/story/76ace905-68bc-41f1-a066-107e9b3928bf", "media": ["X：Alex Heath (@alexeheath)"], "audio": "assets/audio/hot-2026-10-11-10.mp3"}]}

<script>
const DATA = JSON.parse(document.getElementById('cards-data').textContent);
const DAYS = (DATA.days && DATA.days.length) ? DATA.days : (DATA.cards ? [{date: DATA.date, cards: DATA.cards}] : []);
const TODAY = DAYS.length ? DAYS[DAYS.length-1] : {date: DATA.date, cards: []};
const NAV = [
  {hash:'featured', ic:'🗂️', label:'精选'},
  {hash:'all',      ic:'📋', label:'全部动态'},
  {hash:'hot',      ic:'🔥', label:'热点榜'},
  {hash:'daily',    ic:'📖', label:'探索日报'},
  {hash:'starred',  ic:'⭐', label:'我的收藏'},
  {hash:'about',    ic:'💡', label:'关于'},
];
const esc = s => {const d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML;};
const paras = (src, st) => (src||'').split(/\n+/).map(s=>s.trim()).filter(Boolean).map(p=>`<p style="${st}">${esc(p)}</p>`).join('');
const CATS = ['全部','模型','产品','行业','论文','教程','观点'];
const WEEK = '日一二三四五六';
const md = ds => { const [,m,d] = ds.split('-'); return `${+m}月${+d}日`; };
const wk = ds => '星期' + WEEK[new Date(ds+'T12:00:00').getDay()];
const TOTAL_CARDS = DAYS.reduce((n,d)=>n+d.cards.length,0);
const thumbOf = p => p ? String(p).replace(/^assets\//, 'assets/thumbs/') : p;

/* uid 体系：日期#序号 */
const uidOf = (date, i) => date + '#' + i;
function findCard(uid){
  const [d, i] = uid.split('#');
  const day = DAYS.find(x => x.date === d);
  return day ? {day, card: day.cards[+i], idx: +i} : null;
}

/* ── 收藏（本机 localStorage，零采集） ── */
const STAR_KEY = 'xlab-ai-explore-starred';
const getStars = () => { try { return JSON.parse(localStorage.getItem(STAR_KEY)) || []; } catch { return []; } };
const isStar = uid => getStars().some(x => x.uid === uid);
function toggleStar(uid){
  const f = findCard(uid); if (!f) return;
  let stars = getStars();
  if (isStar(uid)) stars = stars.filter(x => x.uid !== uid);
  else stars.unshift({uid, date: f.day.date, ...f.card});
  localStorage.setItem(STAR_KEY, JSON.stringify(stars.slice(0, 300)));
  render();
}
function exportStars(){
  const blob = new Blob([JSON.stringify(getStars(), null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'xlab-探索报-我的收藏.json'; a.click();
}

/* ── 朗读：AI 预生成语音（晓伊/云夏随机）· 单条朗读 + 本日连读 ── */
let xlabAudio = null;
let daySession = null;   /* {uids, i, kind, btn, active} */
function resetReadButtons(){
  document.querySelectorAll('.btn-read.speaking').forEach(b=>{
    b.classList.remove('speaking');
    if (b.dataset.lbl) b.textContent = b.dataset.lbl;
  });
  document.querySelectorAll('[data-playday]').forEach(b=>{
    b.classList.remove('playing');
    if (b.dataset.lbl) b.textContent = b.dataset.lbl;
  });
  document.querySelectorAll('.playing-now').forEach(x=>x.classList.remove('playing-now'));
}
function stopAll(){
  if (xlabAudio){ xlabAudio.pause(); xlabAudio = null; }
  if (daySession){ daySession.active = false; daySession = null; }
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  resetReadButtons();
}
function speakText(text, done){
  const synth = window.speechSynthesis;
  if (!synth || !text){ done(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=0.95;
  u.onend = u.onerror = done;
  synth.speak(u);
}
function playClip(src, done){
  const a = new Audio(src);
  xlabAudio = a;
  let fired = false;
  const fin = ()=>{ if (fired) return; fired = true; if (xlabAudio === a) xlabAudio = null; done(); };
  a.onended = fin; a.onerror = fin;
  a.play().catch(fin);
}

/* 单条朗读 */
document.addEventListener('click', e=>{
  const btn = e.target.closest('.btn-read');
  if(!btn || btn.dataset.playday) return;
  const wasOn = btn.classList.contains('speaking');
  stopAll();
  if (wasOn) return;
  btn.classList.add('speaking'); btn.textContent='⏹ 停止朗读';
  const done = ()=>{ btn.classList.remove('speaking'); btn.textContent = btn.dataset.lbl || '🔊 听我读'; };
  if (btn.dataset.audio){ playClip(btn.dataset.audio, done); }
  else { speakText(btn.dataset.speak, done); }
});

/* 本日连读：先播报“第 x 条热点/精选热点”，再读该条语音，逐条推进 */
function startDayPlay(dayEl, kind, btn){
  stopAll();
  const uids = [...dayEl.querySelectorAll('[data-uid]')].map(x=>x.dataset.uid);
  if (!uids.length) return;
  daySession = {uids, i:0, kind, btn, active:true};
  btn.classList.add('playing');
  playNextInDay();
}
function playNextInDay(){
  const s = daySession;
  if (!s || !s.active) return;
  if (s.i >= s.uids.length){ stopAll(); return; }
  s.btn.textContent = `⏹ 连读中 ${s.i+1}/${s.uids.length}`;
  const uid = s.uids[s.i];
  const annSrc = `assets/audio/ann-${s.kind}-${String(s.i+1).padStart(2,'0')}.mp3`;
  playClip(annSrc, ()=>{
    if (!daySession || !daySession.active) return;
    document.querySelectorAll('.playing-now').forEach(x=>x.classList.remove('playing-now'));
    const row = document.querySelector(`[data-uid="${CSS.escape(uid)}"]`);
    if (row){ row.classList.add('playing-now'); row.scrollIntoView({behavior:'smooth', block:'center'}); }
    const f = findCard(uid);
    const card = f ? f.card : null;
    const cont = ()=>{
      if (daySession && daySession.active){ daySession.i++; setTimeout(playNextInDay, 350); }
    };
    if (card && card.audio){ playClip(card.audio, cont); }
    else if (card){ speakText((card.what||'') + (card.why||''), cont); }
    else cont();
  });
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-playday]');
  if (!b) return;
  if (b.classList.contains('playing')){ stopAll(); return; }
  const dayEl = document.getElementById(b.dataset.playday);
  if (dayEl) startDayPlay(dayEl, b.dataset.kind, b);
});
document.addEventListener('click', e=>{

  if (g && !e.target.closest('button, a, [data-star], [data-unstar]')) { location.hash = g.dataset.go; }

  const ym = `${end.getFullYear()}年${end.getMonth()+1}月`;
  const daysInMonth = new Date(end.getFullYear(), end.getMonth()+1, 0).getDate();
  let cal = '<div class="cal">' + '日一二三四五六'.split('').map(d=>`<span>${d}</span>`).join('');

    const ds = `${end.getFullYear()}-${String(end.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

/* ── 雷达读栏 ── */
async function loadRadar(){
  const box = document.getElementById('radar');
  if (!box) return;
  try{
    const r = await fetch('https://aihot.news/api/v1/dailies/latest', {headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    const rep = d.report || {};
    let html = '';
    (rep.sections||[]).forEach(sec=>{
      html += `<div style="font-size:13px;font-weight:800;color:var(--purple);margin:10px 0 4px">「${esc(sec.label)}」</div>`;
      (sec.items||[]).slice(0,2).forEach(it=>{
        const s = (it.summary||'').replace(/\s+/g,'');
        html += `<div style="padding:7px 0;border-bottom:1px solid #f1eefb;font-size:13.5px"><b>${esc(it.title)}</b>
          <a href="${esc((it.links||{}).original||'#')}" target="_blank" rel="noopener noreferrer" style="color:var(--sky);font-size:12px;text-decoration:none;white-space:nowrap">看原新闻↗</a>
          <div style="color:var(--muted);font-size:12px">${esc(s.slice(0,70))}${s.length>70?'…':''}</div></div>`;
      });
    });
    html += `<div style="font-size:12px;color:var(--muted);margin-top:10px">📡 实时读取 · 数据来源：AI HOT（aihot.news）· ${esc(rep.date||'')}</div>`;
    box.innerHTML = html;
  }catch(err){
    box.innerHTML = '<div class="empty">📡 雷达暂时没连上，不影响阅读探索卡。</div>';
  }
}

/* ── 路由 ── */
function currentRoute(){
  const h = location.hash.slice(1);
  if (h.startsWith('c/')) return {view:'card', uid: decodeURIComponent(h.slice(2))};
  if (h.startsWith('h/')) return {view:'hotcard', rank: decodeURIComponent(h.slice(2))};
  const v = h || 'featured';
  return {view: NAV.some(n=>n.hash===v) ? v : 'featured'};
}
function render(){
  const r = currentRoute();
  const views = {featured:viewFeatured, all:viewAll, hot:viewHot, daily:viewDaily, starred:viewStarred, about:viewAbout};
  document.getElementById('view').innerHTML = r.view === 'card' ? viewCard(r.uid)
    : r.view === 'hotcard' ? viewHotCard(r.rank) : (views[r.view]||viewFeatured)();
  document.querySelectorAll('.nav a, .bottomnav a').forEach(a=>a.classList.toggle('on', a.dataset.hash===r.view));
  document.getElementById('sb-issue').textContent = DATA.issue||1;
  document.getElementById('sb-days').textContent = DAYS.length;
  const mb = document.getElementById('mb-issue'); if (mb) mb.textContent = '第 ' + (DATA.issue||1) + ' 期 · ' + DAYS.length + ' 天';
  window.scrollTo(0,0);
}
document.getElementById('nav').innerHTML = NAV.map(n=>`<a href="#${n.hash}" data-hash="${n.hash}"><span class="ic">${n.ic}</span>${n.label}</a>`).join('');
document.getElementById('bottomnav').innerHTML = NAV.map(n=>`<a href="#${n.hash}" data-hash="${n.hash}"><span class="ic">${n.ic}</span>${n.label}</a>`).join('');
document.addEventListener('click', e=>{
  const c = e.target.closest('[data-cat]');
  if (!c) return;
  curCat = c.dataset.cat;
  render();
});
window.addEventListener('hashchange', render);
render();
</script>
