/* 热点名次走势迷你曲线（数据=探索报每 2 小时自动记录的快照；名次 1 在顶部；断档自动断开成段） */
function trendSvg(h, W=104, H=34){
  const arr = ((((DATA.hot_snapshots||{}).ranks)||{})[h.sid]) || [];
  const n = arr.length;
  const clamp = r => Math.max(1, Math.min(10, Number(r) || 10));
  const P = 4;
  const X = i => P + (n<=1 ? 0 : i/(n-1)) * (W - 2*P);
  const Y = r => P + (clamp(r)-1)/9 * (H - 2*P);
  const segs = []; let cur = [];
  arr.forEach((r, i) => {
    if (r == null) { if (cur.length) segs.push(cur); cur = []; }
    else cur.push([X(i), Y(r)]);
  });
  if (cur.length) segs.push(cur);
  const pts = segs.reduce((a, s) => a + s.length, 0);
  if (pts < 2) return '<span class="twait">📈 走势积累中</span>';
  const lines = segs.filter(s => s.length > 1)
    .map(s => `<polyline points="${s.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#ff9f43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  const first = segs[0][0], lastSeg = segs[segs.length-1], last = lastSeg[lastSeg.length-1];
  const dots = `<circle cx="${first[0].toFixed(1)}" cy="${first[1].toFixed(1)}" r="2" fill="#c9c4e8"/>` +
               `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.8" fill="#e8590c"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="名次走势曲线">${lines}${dots}</svg>`;
}

/* 热榜涨跌小标（用名次快照最近两点对比；不足两点不显示） */
function rankDelta(h){
  const arr = ((((DATA.hot_snapshots||{}).ranks)||{})[h.sid]) || [];
  const vals = arr.filter(x => x != null).map(Number);
  if (vals.length < 2) return '';
  const prev = vals[vals.length-2], cur = vals[vals.length-1];
  if (cur < prev) return `<span class="hdelta up">↑ ${prev-cur}</span>`;
  if (cur > prev) return `<span class="hdelta down">↓ ${cur-prev}</span>`;
  return '<span class="hdelta">持平</span>';
}

/* 讨论来源头像圈（取每条热点的来源名前几个字） */
const AVA_C = ['#ff9f43','#3b82c4','#5b4bc4','#31a36b'];
function avatars(h){
  const arr = (h.media||[]).filter(Boolean);
  if (!arr.length) return '';
  const one = n => {
    const s = String(n).replace(/^[^：:]{0,12}[：:]\s*/, '').trim();
    const m = s.match(/[\u4e00-\u9fa5A-Za-z0-9]/);
    return m ? m[0].toUpperCase() : '·';
  };
  return `<span class="havs">${arr.slice(0,4).map((n,i)=>`<i style="background:${AVA_C[i%4]}">${esc(one(n))}</i>`).join('')}${arr.length>4?`<i class="more">+${arr.length-4}</i>`:''}</span>`;
}

/* uid 体系：日期#序号 */
const uidOf = (date, i) => date + '#' + i;
function findCard(uid){
  const [d, i] = uid.split('#');
  const day = DAYS.find(x => x.date === d);
  return day ? {day, card: day.cards[+i], idx: +i} : null;
}

/* ── 收藏（本机 localStorage，零采集） ── */
const STAR_KEY = 'xlab-ai-explore-starred';
const getStars = () => { try { return JSON.parse(localStorage.getItem(STAR_KEY)) || []; } catch { return []; } };
const isStar = uid => getStars().some(x => x.uid === uid);
function toggleStar(uid){
  const f = findCard(uid); if (!f) return;
  let stars = getStars();
  if (isStar(uid)) stars = stars.filter(x => x.uid !== uid);
  else stars.unshift({uid, date: f.day.date, ...f.card});
  localStorage.setItem(STAR_KEY, JSON.stringify(stars.slice(0, 300)));
  render();
}
function exportStars(){
  const blob = new Blob([JSON.stringify(getStars(), null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'xlab-探索报-我的收藏.json'; a.click();
}

/* ── 朗读：AI 预生成语音（晓伊/云夏随机）· 单条朗读 + 本日连读 ── */
let xlabAudio = null;
let daySession = null;   /* {uids, i, kind, btn, active} */
function resetReadButtons(){
  document.querySelectorAll('.btn-read.speaking').forEach(b=>{
    b.classList.remove('speaking');
    if (b.dataset.lbl) b.textContent = b.dataset.lbl;
  });
  document.querySelectorAll('[data-playday]').forEach(b=>{
    b.classList.remove('playing');
    if (b.dataset.lbl) b.textContent = b.dataset.lbl;
  });
  document.querySelectorAll('.playing-now').forEach(x=>x.classList.remove('playing-now'));
  const lb = document.getElementById('listen-all');
  if (lb){ lb.classList.remove('playing'); lb.textContent = '▶ 再听一遍'; }
}
function stopAll(){
  if (xlabAudio){ xlabAudio.pause(); xlabAudio = null; }
  if (daySession){ daySession.active = false; daySession = null; }
  if (listenSession){ listenSession.active = false; listenSession = null; }
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  resetReadButtons();
}
function speakText(text, done){
  const synth = window.speechSynthesis;
  if (!synth || !text){ done(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=0.95;
  u.onend = u.onerror = done;
  synth.speak(u);
}
function playClip(src, done){
  const a = new Audio(src);
  xlabAudio = a;
  let fired = false;
  const fin = ()=>{ if (fired) return; fired = true; if (xlabAudio === a) xlabAudio = null; done(); };
  a.onended = fin; a.onerror = fin;
  a.play().catch(fin);
}

/* 名词小知识弹窗（手机底部滑出 / 桌面居中浮窗） */
function showTerm(term, explain){
  let box = document.getElementById('termbox');
  if (!box){
    box = document.createElement('div');
    box.id = 'termbox';
    box.innerHTML = '<div class="tb-mask"></div><div class="tb-panel" role="dialog" aria-label="名词解释"><button class="tb-close" aria-label="关闭">✕</button><div class="tb-cat">📚 名词小知识</div><b class="tb-term"></b><div class="tb-explain"></div></div>';
    document.body.appendChild(box);
    box.querySelector('.tb-mask').addEventListener('click', hideTerm);
    box.querySelector('.tb-close').addEventListener('click', hideTerm);
  }
  box.querySelector('.tb-term').textContent = term;
  box.querySelector('.tb-explain').textContent = explain || '';
  box.classList.add('on');
}
function hideTerm(){ const box = document.getElementById('termbox'); if (box) box.classList.remove('on'); }
document.addEventListener('click', e=>{
  const tm = e.target.closest('.term');
  if (tm) showTerm(tm.dataset.term, tm.dataset.explain);
});

/* 单条朗读 */
document.addEventListener('click', e=>{
  const btn = e.target.closest('.btn-read');
  if(!btn || btn.dataset.playday) return;
  const wasOn = btn.classList.contains('speaking');
  stopAll();
  if (wasOn) return;
  btn.classList.add('speaking'); btn.textContent='⏹ 停止朗读';
  const done = ()=>{ btn.classList.remove('speaking'); btn.textContent = btn.dataset.lbl || '🔊 听我读'; };
  if (btn.dataset.audio){ playClip(btn.dataset.audio, done); }
  else { speakText(btn.dataset.speak, done); }
});

/* 本日连读：先播报“第 x 条热点/精选热点”，再读该条语音，逐条推进 */
function startDayPlay(dayEl, kind, btn){
  stopAll();
  const uids = [...dayEl.querySelectorAll('[data-uid]')].map(x=>x.dataset.uid);
  if (!uids.length) return;
  daySession = {uids, i:0, kind, btn, active:true};
  btn.classList.add('playing');
  playNextInDay();
}
function playNextInDay(){
  const s = daySession;
  if (!s || !s.active) return;
  if (s.i >= s.uids.length){ stopAll(); return; }
  s.btn.textContent = `⏹ 连读中 ${s.i+1}/${s.uids.length}`;
  const uid = s.uids[s.i];
  const annSrc = `assets/audio/ann-${s.kind}-${String(s.i+1).padStart(2,'0')}.mp3`;
  playClip(annSrc, ()=>{
    if (!daySession || !daySession.active) return;
    document.querySelectorAll('.playing-now').forEach(x=>x.classList.remove('playing-now'));
    const row = document.querySelector(`[data-uid="${CSS.escape(uid)}"]`);
    if (row){ row.classList.add('playing-now'); row.scrollIntoView({behavior:'smooth', block:'center'}); }
    const f = findCard(uid);
    const card = f ? f.card : null;
    const cont = ()=>{
      if (daySession && daySession.active){ daySession.i++; setTimeout(playNextInDay, 350); }
    };
    if (card && card.audio){ playClip(card.audio, cont); }
    else if (card){ speakText((card.what||'') + (card.why||''), cont); }
    else cont();
  });
}

/* ── 听我读·整期连播页（长图"听我读"二维码入口；#listen 或 #listen/<date>）── */
let listenSession = null;   /* {list:[{audio,idx}], i, btn, active} */
function viewListen(dateArg){
  const day = (dateArg && DAYS.find(d=>d.date===dateArg)) || DAYS[DAYS.length-1];
  if (!day || !day.cards.length) return heroHead('🎧 听我读', '') + `<main class="wrap"><div class="empty">这一天还没有内容</div></main>`;
  const cards = day.cards;
  const withAudio = cards.filter(c=>c.audio).length;
  const mins = Math.max(3, Math.round(cards.length * 1.8));
  return heroHead('🎧 听我读 · 探索报', `${esc(md(day.date))} ${esc(wk(day.date))} · ${cards.length} 条 · 约 ${mins} 分钟`, '')
  + `<main class="wrap">
    <div class="listen-hero">
      <button class="listen-big" id="listen-all" onclick="startListenPlay('${esc(day.date)}')">▶ 开始听今天（${cards.length} 条）</button>
      <div class="listen-note">${withAudio===cards.length ? `共 ${cards.length} 条语音，会一条接一条自动播下去` : `${withAudio}/${cards.length} 条有语音`} · 语音由 AI 合成（晓伊姐姐/云夏哥哥）· 请家长把音量调合适</div>
    </div>
    ${cards.map((c,i)=>`<div class="listen-row" id="lrow-${i}">
      <span class="l-no">${String(i+1).padStart(2,'0')}</span>
      <div class="l-mid"><b>${esc(c.title)}</b><span>${esc((c.what||'').slice(0,46))}…</span></div>
      <button class="btn btn-read l-btn" data-lbl="▶ 听这条" data-audio="${esc(c.audio||'')}" data-speak="${esc(c.body||c.what||'')}${esc(c.why||'')}">▶ 听这条</button>
    </div>`).join('')}
    <div class="empty" style="border-style:solid;margin-top:14px">🎧 小朋友可以闭上眼睛听：一条播完会自动播下一条</div>
  </main>`;
}
function startListenPlay(dateStr){
  const btn = document.getElementById('listen-all');
  if (btn && btn.classList.contains('playing')){ stopAll(); return; }
  stopAll();
  const day = DAYS.find(d=>d.date===dateStr);
  if (!day) return;
  const list = day.cards.map((c,i)=>({audio:c.audio, idx:i})).filter(x=>x.audio);
  if (!list.length) return;
  listenSession = {list, i:0, btn, active:true};
  if (btn){ btn.classList.add('playing'); btn.textContent = `⏹ 播放中 0/${list.length}`; }
  listenNext();
}
function listenNext(){
  const s = listenSession; if (!s || !s.active) return;
  document.querySelectorAll('.listen-row.playing-now').forEach(x=>x.classList.remove('playing-now'));
  if (s.i >= s.list.length){ stopAll(); return; }
  const item = s.list[s.i];
  if (s.btn) s.btn.textContent = `⏹ 播放中 ${s.i+1}/${s.list.length}`;
  const row = document.getElementById('lrow-' + item.idx);
  if (row){ row.classList.add('playing-now'); row.scrollIntoView({behavior:'smooth', block:'center'}); }
  playClip(item.audio, ()=>{ if (listenSession && listenSession.active){ listenSession.i++; setTimeout(listenNext, 550); } });
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-playday]');
  if (!b) return;
  if (b.classList.contains('playing')){ stopAll(); return; }
  const dayEl = document.getElementById(b.dataset.playday);
  if (dayEl) startDayPlay(dayEl, b.dataset.kind, b);
});
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]');
  if (g && !e.target.closest('button, a, [data-star], [data-unstar]')) { location.hash = g.dataset.go; }

document.addEventListener('click', e=>{

});

/* ── 视图 ── */
let curCat = '全部';
const REVERSED = [...DAYS].reverse();

function heroHead(title, sub, extra=''){
  return `<header class="hero"><div class="wrap">
    <h1>${title}</h1>
    <div class="sub">${sub}</div>
    ${extra}
  </div></header>`;
}

function viewFeatured(){
  const hot5 = (DATA.hot||[]).slice(0,5);
  /* ── 常青卡池：从往期全部卡按「常青分＋每日轮换扰动」排序（排除今天——今天归探索日报/时间轴）── */
  const hashCode = s => { let h = 0; for (const ch of s) h = (h*31 + ch.charCodeAt(0)) | 0; return Math.abs(h); };
  const pool = [];
  DAYS.forEach(d => {
    if (d.date === TODAY.date) return;
    d.cards.forEach((c, i) => {
      const ev = c.evergreen;
      if (!ev || Number(ev.score) < 60) return;
      const uid = uidOf(d.date, i);
      pool.push({c, uid, date: d.date, k: Number(ev.score) - (hashCode(uid + DATA.date) % 14)});
    });
  });
  pool.sort((a,b)=>b.k-a.k);
  const picks = pool.slice(0, 48);
  return heroHead(`xLab-AI 探索报 <span class="iss">第 ${DATA.issue||1} 期</span>`,
    '🌟 值得回看：从往期所有探索卡里，挑出最值得给小朋友看的一批（不限今天、每天轮换）',
    `<div class="chips"><span class="chip">📅 ${esc(TODAY.date)}</span><span class="chip">🆕 今日新增 ${TODAY.cards.length} 条</span><span class="chip">🗂️ 已收录 ${TOTAL_CARDS} 张</span></div>
     <div class="strip">✦ 今天的新内容在「探索日报」和「全部动态」✦ 每张卡由 AI 从公开新闻自动转译，可能有错误，欢迎纠错 ✦ 原始新闻是给大人看的，点开前请家长陪同 ✦</div>`)
  + `<main class="wrap">
    <div class="sec"><span class="ic">🔥</span><h2>当前热点</h2><span class="note"><a href="#hot" style="color:var(--sky)">完整榜单 →</a></span></div>
    ${hot5.length ? `<div class="hotstrip">${hot5.map(h=>`<a class="hs" href="#hot"><span class="r">${esc(h.rank)}</span><span class="t">${esc((h.one_line||'').slice(0,20))}</span></a>`).join('')}</div>` : ''}
    <div class="sec"><span class="ic">🌟</span><h2>值得回看</h2><span class="note">往期最值得看的 ${picks.length} 张 · 每天轮换 · 点卡片看详情</span></div>
    ${picks.length ? picks.map(p=>everCard(p)).join('') : '<div class="empty">🌟 回看池整理中（正在给往期卡片打分），先去探索日报看看今天的内容吧</div>'}
    <div class="empty" style="border-style:solid">今天新转译的内容 → <a href="#daily" style="color:var(--sky)">探索日报</a> · <a href="#all" style="color:var(--sky)">全部动态（时间轴）</a> · <a href="javascript:void(0)" onclick="loadRadarInto(this)" style="color:var(--sky)">家长角（原始新闻雷达）</a></div>
    <div id="radar"></div>
  </main>`;
}
/* 「值得回看」条目卡：左图右文 + 常青标签 + 回看理由 */
function everCard(p){
  const c = p.c, uid = p.uid;
  const go = ` data-go="#c/${esc(encodeURIComponent(uid))}"`;
  const img = c.image ? `<img src="${esc(thumbOf(c.image))}" alt="${esc(c.title)}插图" loading="lazy" decoding="async">`
    : `<div class="noimg">${esc(c.emoji||'🤖')}</div>`;
  return `<article class="mini">
    ${img}
    <div style="flex:1">
      <h4 class="clicky"${go}>${esc(c.title)}</h4>${c.category?`<span class="badge">${esc(c.category)}</span>`:''} <span class="badge evb">🌟 值得回看</span> ${starBtn(uid)}
      <div class="oneliner clicky"${go}>${esc((c.what||'').slice(0,90))}…</div>
      ${(c.evergreen&&c.evergreen.why)?`<div class="tl-reason clicky"${go} style="border-top:none;padding-top:2px;margin:-2px 0 4px"><b>🌟 为什么值得回看：</b>${esc(c.evergreen.why)}</div>`:''}
      <div class="meta"><span>📅 ${esc(md(p.date))}</span>
        <a class="btn btn-orig" style="padding:2px 10px;font-size:12px" href="${esc(c.original_url||'#')}" target="_blank" rel="noopener noreferrer">原文↗</a>
        <button class="btn btn-read" data-lbl="🔊 读" style="padding:2px 10px;font-size:12px" data-audio="${esc(c.audio||'')}" data-speak="${esc(c.body||c.what||'')}${esc(c.why||'')}">🔊 读</button>
      </div>
    </div>
  </article>`;
}
function loadRadarInto(el){
  const box = document.getElementById('radar');
  if (box){ box.className = 'card'; box.style.padding = '16px 20px'; box.style.marginTop = '10px';
            box.innerHTML = '<div class="empty">📡 雷达连线中…</div>'; }
  el.style.pointerEvents = 'none';
  loadRadar();
}

function jumpTo(ds){
  if (!ds) return;
  const el = document.getElementById('day-' + ds);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

/* 日期跳转面板（自绘选择器，替代原生下拉）：按月分组、胶囊网格、点一下直达 */
function openDayPicker(){
  let box = document.getElementById('daypick');
  if (!box){
    box = document.createElement('div');
    box.id = 'daypick';
    box.innerHTML = '<div class="dp-mask"></div><div class="dp-panel" role="dialog" aria-label="跳转到日期"><button class="dp-close" aria-label="关闭">✕</button><div class="dp-cat">📅 跳到哪一天？</div><div class="dp-body"></div></div>';
    document.body.appendChild(box);
    box.querySelector('.dp-mask').addEventListener('click', hideDayPicker);
    box.querySelector('.dp-close').addEventListener('click', hideDayPicker);
    box.addEventListener('click', e=>{
      const d = e.target.closest('.dp-day');
      if (d && d.dataset.jump){ hideDayPicker(); jumpTo(d.dataset.jump); }
    });
  }
  const byMonth = {};
  DAYS.forEach(d => { const k = d.date.slice(0,7); (byMonth[k] = byMonth[k] || []).push(d); });
  box.querySelector('.dp-body').innerHTML = Object.keys(byMonth).sort().reverse().map(k => {
    const [y, m] = k.split('-');
    const days = byMonth[k].slice().sort((a,b)=>b.date.localeCompare(a.date));
    return `<div class="dp-month">${y} 年 ${+m} 月</div>
      <div class="dp-grid">${days.map(d=>`<button class="dp-day${d.date===TODAY.date?' today':''}" data-jump="${esc(d.date)}"><b>${+d.date.slice(8)}日</b><span>${esc(wk(d.date).replace('星期','周'))}</span><i>${d.cards.length} 张</i></button>`).join('')}</div>`;
  }).join('');
  box.classList.add('on');
}
function hideDayPicker(){ const box = document.getElementById('daypick'); if (box) box.classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ hideDayPicker(); hideTerm(); } });

function viewDaily(){
  const mins = Math.max(3, TODAY.cards.length * 2);
  const issueDates = new Set(DAYS.map(d=>d.date));
  const end = new Date(TODAY.date+'T12:00:00');
  const daysInMonth = new Date(end.getFullYear(), end.getMonth()+1, 0).getDate();
  let cal = '<div class="cal">' + '日一二三四五六'.split('').map(d=>`<span>${d}</span>`).join('');
  for (let d=1; d<=daysInMonth; d++){
    const ds = `${end.getFullYear()}-${String(end.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds === TODAY.date;
    const has = issueDates.has(ds);
    cal += `<span class="${isToday?'today':(has?'has':'')}" ${has && !isToday ? `onclick="location.hash='#all';setTimeout(()=>jumpTo('${ds}'),150)" style="cursor:pointer"`:''}>${d}</span>`;
  }
  cal += '</div>';
  const past = REVERSED.filter(d => d.date !== TODAY.date);
  /* 报头一体化（江 2026-10-15 令）：原 .issue-head 白卡整块并入横幅；小字说明行删除 */
  return `<header class="hero hero-daily"><div class="wrap">
    <div class="hd-left">
      <h1>探索日报 <span class="iss">第 ${DATA.issue||1} 期</span></h1>
      <div class="sub">每天早上一份 · 把今天 AI 界的大事讲给你听 · 往期都在时间轴里</div>
    </div>
    <div class="hd-right">
      ${cal}
      <div class="hd-side">
        <a class="btn btn-read" href="#listen/${esc(TODAY.date)}" style="text-decoration:none">🎧 听整期（${TODAY.cards.length} 条语音连播）</a>
        <div class="stats-inline"><b>${TODAY.cards.length}</b> 今日大事 · <b>${(DATA.hot||[]).length}</b> 条热议 · 约 <b>${mins}</b> 分钟读完</div>
      </div>
    </div>
  </div></header>
  <main class="wrap">
    <div class="sec"><span class="ic">📖</span><h2>本期全部</h2><span class="note">${esc(TODAY.date)} ${esc(wk(TODAY.date))}</span></div>
    ${TODAY.cards.map((c,i)=>bigCard(c, uidOf(TODAY.date, i))).join('')}
    ${past.length ? `<div class="sec"><span class="ic">🗂️</span><h2>往期</h2><span class="note">点击回到那一天的探索卡</span></div>
    <div class="archive">${past.map(d=>`
      <a onclick="location.hash='#all';setTimeout(()=>jumpTo('${d.date}'),150)"><b>${esc(md(d.date))}</b> ${esc(wk(d.date))} · ${d.cards.map(c=>esc(c.emoji+' '+c.title)).join('　')}</a>`).join('')}
    </div>` : ''}
  </main>`;
}

document.addEventListener('click', e=>{
  const u = e.target.closest('[data-unstar]');
  if (!u) return;
  let stars = getStars().filter(x => x.uid !== u.dataset.unstar);
  localStorage.setItem(STAR_KEY, JSON.stringify(stars));
  render();

/* ── 雷达读栏 ── */
async function loadRadar(){
  const box = document.getElementById('radar');
  if (!box) return;
  try{
    const r = await fetch('https://aihot.news/api/v1/dailies/latest', {headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    const rep = d.report || {};
    let html = '';
    (rep.sections||[]).forEach(sec=>{
      html += `<div style="font-size:13px;font-weight:800;color:var(--purple);margin:10px 0 4px">「${esc(sec.label)}」</div>`;
      (sec.items||[]).slice(0,2).forEach(it=>{
        const s = (it.summary||'').replace(/\s+/g,'');
        html += `<div style="padding:7px 0;border-bottom:1px solid #f1eefb;font-size:13.5px"><b>${esc(it.title)}</b>
          <a href="${esc((it.links||{}).original||'#')}" target="_blank" rel="noopener noreferrer" style="color:var(--sky);font-size:12px;text-decoration:none;white-space:nowrap">看原新闻↗</a>
          <div style="color:var(--muted);font-size:12px">${esc(s.slice(0,70))}${s.length>70?'…':''}</div></div>`;
      });
    });
    html += `<div style="font-size:12px;color:var(--muted);margin-top:10px">📡 实时读取 · 数据来源：AI HOT（aihot.news）· ${esc(rep.date||'')}</div>`;
    box.innerHTML = html;
  }catch(err){
    box.innerHTML = '<div class="empty">📡 雷达暂时没连上，不影响阅读探索卡。</div>';
  }
}

/* ── 路由 ── */
function currentRoute(){
  const h = location.hash.slice(1);
  if (h.startsWith('c/')) return {view:'card', uid: decodeURIComponent(h.slice(2))};
  if (h.startsWith('h/')) return {view:'hotcard', rank: decodeURIComponent(h.slice(2))};
  if (h === 'listen' || h.startsWith('listen/')) return {view:'listen', date: decodeURIComponent(h.slice(7))};
  const v = h || 'featured';
  return {view: NAV.some(n=>n.hash===v) ? v : 'featured'};
}
function render(){
  const r = currentRoute();
  const views = {featured:viewFeatured, all:viewAll, hot:viewHot, daily:viewDaily, starred:viewStarred, about:viewAbout};
  document.getElementById('view').innerHTML = r.view === 'card' ? viewCard(r.uid)
    : r.view === 'hotcard' ? viewHotCard(r.rank) : r.view === 'listen' ? viewListen(r.date) : (views[r.view]||viewFeatured)();
  document.querySelectorAll('.nav a, .bottomnav a').forEach(a=>a.classList.toggle('on', a.dataset.hash===r.view));
  document.getElementById('sb-issue').textContent = DATA.issue||1;
  document.getElementById('sb-days').textContent = DAYS.length;
  const mb = document.getElementById('mb-issue'); if (mb) mb.textContent = '第 ' + (DATA.issue||1) + ' 期 · ' + DAYS.length + ' 天';
  window.scrollTo(0,0);
}
document.getElementById('nav').innerHTML = NAV.map(n=>`<a href="#${n.hash}" data-hash="${n.hash}"><span class="ic">${n.ic}</span>${n.label}</a>`).join('');
/* 手机底栏只保留 4 个内容入口（收藏→顶栏 ⭐，关于→页脚）；顺序独立定于此、不随电脑端侧栏变化 */
document.getElementById('bottomnav').innerHTML = ['featured','all','hot','daily'].map(h=>NAV.find(n=>n.hash===h)).map(n=>`<a href="#${n.hash}" data-hash="${n.hash}"><span class="ic">${n.ic}</span>${n.label}</a>`).join('');
document.addEventListener('click', e=>{
  const c = e.target.closest('[data-cat]');
  if (!c) return;
  curCat = c.dataset.cat;
  render();
});
window.addEventListener('hashchange', render);
render();
</script>
